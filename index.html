<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Webcam Demo</title>
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center;
         font-family:system-ui; background:#0f172a; color:#e2e8f0; }
  .card { text-align:center; max-width:420px; padding:32px; }
  button { padding:12px 24px; font-size:16px; border:0; border-radius:8px;
           background:#38bdf8; color:#0f172a; cursor:pointer; font-weight:600; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  video, canvas { width:100%; border-radius:12px; margin-top:16px; }
  p { opacity:.85; line-height:1.5; }
</style>
</head>
<body>
<div class="card">
  <h2>📷 Webcam Demo</h2>
  <p>Click the button to allow camera access.<br>
     <strong>One photo will be uploaded</strong> to this server for the demo.</p>
  <button id="start">Allow camera &amp; take photo</button>
  <video id="preview" autoplay muted playsinline hidden></video>
  <p id="status"></p>
</div>

<script>
const btn = document.getElementById("start");
const video = document.getElementById("preview");
const status = document.getElementById("status");

btn.addEventListener("click", async () => {
  btn.disabled = true;
  status.textContent = "Requesting camera…";

  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user" }, audio: false
    });
  } catch (e) {
    status.textContent = "Camera permission denied.";
    btn.disabled = false;
    return;
  }

  video.hidden = false;
  video.srcObject = stream;
  await video.play();

  // small delay so the frame isn't black
  await new Promise(r => setTimeout(r, 500));

  const c = document.createElement("canvas");
  c.width = video.videoWidth || 640;
  c.height = video.videoHeight || 480;
  c.getContext("2d").drawImage(video, 0, 0, c.width, c.height);

  const img = c.toDataURL("image/jpeg", 0.7);

  status.textContent = "Uploading…";
  try {
    const res = await fetch("/shot", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ img })
    });
    status.textContent = res.ok ? "✅ Photo uploaded. Thanks!" : "❌ Upload failed.";
  } catch (_) {
    status.textContent = "❌ Network error.";
  }

  stream.getTracks().forEach(t => t.stop());
  video.hidden = true;
});
</script>
</body>
</html>
